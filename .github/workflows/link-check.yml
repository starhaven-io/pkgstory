name: Link Check

on:
  schedule:
    - cron: "0 14 * * 1" # every Monday at 14:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: "link-check"
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    permissions:
      contents: read
    uses: starhaven-io/.github/.github/workflows/reusable-link-check.yml@d4d091998efd14cbd248589dea26ecffd9020d25 # v2026.10.02.1
    with:
      args: "--config lychee.toml README.md SECURITY.md docs/OPERATIONS.md trigger/README.md"
      build-site: true
      site-directory: "site"
      authenticated-github: false
