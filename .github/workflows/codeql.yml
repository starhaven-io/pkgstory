name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "site/**"
      - "trigger/**"
      - ".github/workflows/**"

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@9783ddfb15b9c91b3f53a2a975067ed4937029ad # v2026.09.25.1
    with:
      languages: '["actions","javascript-typescript"]'
      runner: "ubuntu-24.04"
      timeout-minutes: 30
      build-mode: ""
      build-profile: ""
