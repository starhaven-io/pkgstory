name: Crawl

on:
  workflow_dispatch:
  repository_dispatch:
    # Fired by the trigger/ Worker as the starhaven-bot App.
    types: [crawl]
  schedule:
    # Fallback only — the trigger/ Worker drives the real cadence. Offset off the hour.
    - cron: "23 */6 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/crawl.yml

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: crawl
  cancel-in-progress: false # never interrupt a mid-flight D1 write

jobs:
  crawl:
    name: Crawl deltas into D1
    if: github.repository_owner == 'starhaven-io'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: cloudflare # holds the Cloudflare token (matches deploy-site)
    permissions:
      actions: write # required to prune old tap caches with gh cache delete
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute tap cache week
        id: tap-week
        run: echo "week=$(date -u +%G-%V)" >> "${GITHUB_OUTPUT}"

      - name: Restore tap clones
        id: tap-cache
        # setup-homebrew fetches the delta into a pre-existing tap dir and only
        # full-clones when it's absent, so restoring the clones turns ~1-2 min of
        # cloning per run into a few seconds of fetch. The weekly key means one
        # cache save per week (first run after rollover, via restore-keys). Old
        # weekly tap caches are large, so a later step prunes stale keys after
        # the current week is saved or confirmed.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/linuxbrew/.linuxbrew/Homebrew/Library/Taps/homebrew/homebrew-core
            /home/linuxbrew/.linuxbrew/Homebrew/Library/Taps/homebrew/homebrew-cask
          key: taps-v1-${{ steps.tap-week.outputs.week }}
          restore-keys: taps-v1-

      - name: Set up Homebrew taps
        uses: Homebrew/actions/setup-homebrew@5037c6f1012cc5ea0b9f03fedbaf9955ed9e51e0 # 2026.08.03.1
        with:
          # Full (non-shallow) tap clones — brew dropped shallow taps — so the crawler's
          # `git log <cursor>..HEAD` always reaches the stored cursor.
          core: true
          cask: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Check npm install-script policy
        run: node scripts/check-npm-install-policy.mjs . site trigger

      - name: Install wrangler
        working-directory: site
        # Fail if an unreviewed dependency install script is introduced.
        run: npm ci --strict-allow-scripts

      - name: Crawl deltas into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node src/cli.ts crawl --d1 remote

      - name: Save tap clones
        if: steps.tap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/linuxbrew/.linuxbrew/Homebrew/Library/Taps/homebrew/homebrew-core
            /home/linuxbrew/.linuxbrew/Homebrew/Library/Taps/homebrew/homebrew-cask
          key: ${{ steps.tap-cache.outputs.cache-primary-key }}

      - name: Prune old tap caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_TAP_CACHE_KEY: taps-v1-${{ steps.tap-week.outputs.week }}
        run: |
          gh cache list \
            --ref refs/heads/main \
            --key taps-v1- \
            --limit 100 \
            --json id,key \
            --jq ".[] | select(.key != \"${CURRENT_TAP_CACHE_KEY}\") | .id" |
            while IFS= read -r cache_id; do
              gh cache delete "${cache_id}" || echo "::warning::failed to delete tap cache ${cache_id}"
            done

  crawl-issue:
    name: Open/close crawl issue
    needs: crawl
    if: ${{ always() && (needs.crawl.result == 'success' || needs.crawl.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true # issue bookkeeping must not override the crawl result
    permissions:
      issues: write # required to find, create, comment on, and close the failure issue
    steps:
      - name: Open, update, or close crawl issue
        env:
          CRAWL_RESULT: ${{ needs.crawl.result }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: Crawl workflow failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! numbers="$(gh api --paginate --method GET "repos/${GH_REPO}/issues" \
              -f state=open \
              -f 'creator=github-actions[bot]' \
              -f per_page=100 \
              --jq '.[] | select(.title == env.ISSUE_TITLE and (has("pull_request") | not)) | .number')"; then
            echo "::warning::failed to list crawl failure issues"
            exit 1
          fi

          bookkeeping_status=0

          if [ "${CRAWL_RESULT}" = "success" ]; then
            while IFS= read -r number; do
              [ -n "${number}" ] || continue
              if ! gh issue close "${number}" --reason completed \
                  --comment "Crawl run succeeded: ${RUN_URL}" </dev/null; then
                echo "::warning::failed to close crawl issue #${number}"
                bookkeeping_status=1
              fi
            done <<< "${numbers}"
          elif [ "${CRAWL_RESULT}" = "failure" ]; then
            number="${numbers%%$'\n'*}"
            if [ -n "${number}" ]; then
              if ! gh issue comment "${number}" --body "Crawl run failed: ${RUN_URL}" </dev/null; then
                echo "::warning::failed to comment on crawl issue #${number}"
                bookkeeping_status=1
              fi
            else
              if ! printf 'Crawl run failed: %s\n\nFiled automatically by crawl.yml; the next successful crawl closes this issue.\n' \
                  "${RUN_URL}" | gh issue create --title "${ISSUE_TITLE}" --body-file -; then
                echo "::warning::failed to create crawl failure issue"
                bookkeeping_status=1
              fi
            fi
          fi

          exit "${bookkeeping_status}"
